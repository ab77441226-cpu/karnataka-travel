<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment - Karnataka Travel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
            color: #333;
        }

        /* ================= HEADER ================= */

        header {
            min-height: 60px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8%;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #087f3d;
        }

        .logo span {
            color: #222;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #087f3d;
        }

        /* ================= PAGE ================= */

        .payment-page {
            min-height: calc(100vh - 60px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 15px;
        }

        .payment-box {
            width: 100%;
            max-width: 550px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.12);
        }

        /* ================= ICON ================= */

        .payment-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        h1 {
            text-align: center;

            color: #087f3d;

            margin: 0 0 8px;

            font-size: 28px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;

            font-size: 14px;
        }

        /* ================= BOOKING INFO ================= */

        .booking-info {
            background: #f4faf6;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 22px;
        }

        .info-row {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 8px 0;

            border-bottom:
                1px solid #d9e5dd;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;

            font-size: 13px;

            font-weight: bold;
        }

        .info-value {
            color: #222;

            font-size: 13px;

            font-weight: bold;

            text-align: right;

            word-break: break-word;
        }

        .amount {
            color: #087f3d;

            font-size: 20px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #087f3d;
        }

        /* ================= PAYMENT METHODS ================= */

        .payment-methods {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 20px;
        }

        .method {
            border: 1px solid #ccc;

            border-radius: 10px;

            padding: 14px 8px;

            text-align: center;

            cursor: pointer;

            font-size: 13px;

            background: white;

            transition: 0.2s;
        }

        .method:hover {
            border-color: #087f3d;
        }

        .method.selected {
            border: 2px solid #087f3d;

            background: #e8f5ed;

            color: #087f3d;

            font-weight: bold;
        }

        .method-icon {
            display: block;

            font-size: 25px;

            margin-bottom: 6px;
        }

        /* ================= CARD DETAILS ================= */

        #cardDetails {
            display: none;

            background: #f8fbf9;

            border: 1px solid #dce8e0;

            padding: 18px;

            border-radius: 10px;

            margin-bottom: 18px;
        }

        .card-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        /* ================= UPI ================= */

        #upiDetails {
            display: none;

            margin-bottom: 18px;
        }

        /* ================= PAY BUTTON ================= */

        .pay-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #087f3d;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .pay-btn:hover {
            background: #05652f;
        }

        .pay-btn:disabled {
            background: #999;

            cursor: not-allowed;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;
        }

        .error {
            display: block;

            background: #ffebee;

            color: #c62828;
        }

        .success {
            display: block;

            background: #e8f5e9;

            color: #087f3d;
        }

        /* ================= SECURITY ================= */

        .security-note {
            text-align: center;

            margin-top: 18px;

            color: #777;

            font-size: 12px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header {
                padding: 10px 15px;

                flex-direction: column;

                gap: 8px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 11px;
            }

            .payment-page {
                padding: 20px 12px;

                align-items: flex-start;
            }

            .payment-box {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }

            .card-row {
                grid-template-columns: 1fr;
            }

            .info-row {
                flex-direction: column;

                gap: 3px;
            }

            .info-value {
                text-align: left;
            }
        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            🏛️ Karnataka
            <span>Travel</span>

        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="booking-history.html">
                Bookings
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- ================= PAYMENT PAGE ================= -->

    <section class="payment-page">


        <div class="payment-box">


            <div class="payment-icon">

                💳

            </div>


            <h1>

                Complete Payment

            </h1>


            <p class="subtitle">

                Choose your payment method and complete your booking.

            </p>


            <!-- ================= BOOKING INFO ================= -->

            <div class="booking-info">


                <div class="info-row">

                    <span class="info-label">
                        Booking ID
                    </span>

                    <span
                        class="info-value"
                        id="bookingId">
                        Loading...
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Name
                    </span>

                    <span
                        class="info-value"
                        id="bookingName">
                        Loading...
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Destination
                    </span>

                    <span
                        class="info-value"
                        id="destination">
                        Loading...
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Vehicle
                    </span>

                    <span
                        class="info-value"
                        id="vehicle">
                        Loading...
                    </span>

                </div>


                <div class="info-row">

                    <span class="info-label">
                        Total Amount
                    </span>

                    <span
                        class="info-value amount"
                        id="totalAmount">
                        ₹0
                    </span>

                </div>


            </div>


            <!-- ================= MESSAGE ================= -->

            <div
                id="message"
                class="message">
            </div>


            <!-- ================= PAYMENT METHODS ================= -->

            <label
                style="
                    display:block;
                    font-weight:bold;
                    margin-bottom:10px;
                ">

                Select Payment Method

            </label>


            <div class="payment-methods">


                <div
                    class="method"
                    id="upiMethod"
                    onclick="selectMethod('UPI')">

                    <span class="method-icon">
                        📱
                    </span>

                    UPI

                </div>


                <div
                    class="method"
                    id="cardMethod"
                    onclick="selectMethod('Card')">

                    <span class="method-icon">
                        💳
                    </span>

                    Card

                </div>


                <div
                    class="method"
                    id="cashMethod"
                    onclick="selectMethod('Cash')">

                    <span class="method-icon">
                        💵
                    </span>

                    Cash

                </div>


            </div>


            <!-- ================= UPI ================= -->

            <div id="upiDetails">

                <div class="form-group">

                    <label for="upiId">

                        UPI ID

                    </label>

                    <input
                        type="text"
                        id="upiId"
                        placeholder="example@upi"
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- ================= CARD ================= -->

            <div id="cardDetails">


                <div class="form-group">

                    <label for="cardNumber">

                        Card Number

                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        placeholder="1234 5678 9012 3456"
                        maxlength="19"
                        inputmode="numeric"
                    >

                </div>


                <div class="form-group">

                    <label for="cardName">

                        Card Holder Name

                    </label>

                    <input
                        type="text"
                        id="cardName"
                        placeholder="Enter card holder name"
                    >

                </div>


                <div class="card-row">


                    <div class="form-group">

                        <label for="expiry">

                            Expiry

                        </label>

                        <input
                            type="text"
                            id="expiry"
                            placeholder="MM/YY"
                            maxlength="5"
                            inputmode="numeric"
                        >

                    </div>


                    <div class="form-group">

                        <label for="cvv">

                            CVV

                        </label>

                        <input
                            type="password"
                            id="cvv"
                            placeholder="CVV"
                            maxlength="4"
                            inputmode="numeric"
                        >

                    </div>


                </div>

            </div>


            <!-- ================= PAY BUTTON ================= -->

            <button
                type="button"
                class="pay-btn"
                id="payButton"
                onclick="completePayment()">

                💳 Pay Now

            </button>


            <p class="security-note">

                🔒 Demo payment page. Do not enter real card details.

            </p>


        </div>

    </section>


    <script>

        "use strict";


        /* =====================================================
           API BASE

           Computer:
           http://localhost:5000

           Other device:
           http://YOUR-COMPUTER-IP:5000
        ===================================================== */

        const API_BASE =
            window.location.protocol === "file:"
                ? "http://192.168.1.103:5000"
                : `${window.location.protocol}//${window.location.hostname}:5000`;


        /* =====================================================
           VARIABLES
        ===================================================== */

        let booking = null;

        let selectedMethod = "";


        /* =====================================================
           GET CURRENT BOOKING
        ===================================================== */

        const bookingString =
            sessionStorage.getItem(
                "currentBooking"
            );


        if (bookingString) {

            try {

                booking =
                    JSON.parse(
                        bookingString
                    );

            } catch (error) {

                console.error(
                    "Booking data error:",
                    error
                );

                booking = null;

            }

        }


        /* =====================================================
           LOAD BOOKING
        ===================================================== */

        if (booking) {

            displayBooking();

        } else {

            /*
             * If currentBooking is not available,
             * try bookingId from URL.
             */

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const bookingId =
                params.get("bookingId");


            if (bookingId) {

                loadBookingFromServer(
                    bookingId
                );

            } else {

                showMessage(
                    "Booking information not found. Please create a booking first.",
                    "error"
                );

                document.getElementById(
                    "payButton"
                ).disabled = true;

            }

        }


        /* =====================================================
           DISPLAY BOOKING
        ===================================================== */

        function displayBooking() {

            const id =
                booking.bookingId ||
                booking.booking_id ||
                booking.id;


            document.getElementById(
                "bookingId"
            ).textContent =
                id || "-";


            document.getElementById(
                "bookingName"
            ).textContent =
                booking.name || "-";


            document.getElementById(
                "destination"
            ).textContent =
                booking.destination ||
                booking.to ||
                "-";


            document.getElementById(
                "vehicle"
            ).textContent =
                booking.vehicle || "-";


            const total =
                Number(
                    booking.total ||
                    booking.totalAmount ||
                    booking.total_amount ||
                    0
                );


            document.getElementById(
                "totalAmount"
            ).textContent =
                formatCurrency(total);

        }


        /* =====================================================
           LOAD BOOKING FROM SERVER
        ===================================================== */

        async function loadBookingFromServer(
            bookingId
        ) {

            try {

                const response =
                    await fetch(

                        API_BASE +
                        "/api/bookings/" +
                        encodeURIComponent(
                            bookingId
                        )

                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(

                        data.message ||
                        "Booking not found."

                    );

                }


                booking =
                    data.booking;


                sessionStorage.setItem(

                    "currentBooking",

                    JSON.stringify(
                        booking
                    )

                );


                displayBooking();


            } catch (error) {

                console.error(
                    "Booking loading error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to load booking.",
                    "error"
                );


                document.getElementById(
                    "payButton"
                ).disabled = true;

            }

        }


        /* =====================================================
           SELECT PAYMENT METHOD
        ===================================================== */

        function selectMethod(
            method
        ) {

            selectedMethod =
                method;


            document
                .getElementById("upiMethod")
                .classList.remove("selected");


            document
                .getElementById("cardMethod")
                .classList.remove("selected");


            document
                .getElementById("cashMethod")
                .classList.remove("selected");


            if (method === "UPI") {

                document
                    .getElementById("upiMethod")
                    .classList.add("selected");

                document
                    .getElementById("upiDetails")
                    .style.display = "block";

                document
                    .getElementById("cardDetails")
                    .style.display = "none";

            }


            else if (method === "Card") {

                document
                    .getElementById("cardMethod")
                    .classList.add("selected");

                document
                    .getElementById("cardDetails")
                    .style.display = "block";

                document
                    .getElementById("upiDetails")
                    .style.display = "none";

            }


            else if (method === "Cash") {

                document
                    .getElementById("cashMethod")
                    .classList.add("selected");

                document
                    .getElementById("upiDetails")
                    .style.display = "none";

                document
                    .getElementById("cardDetails")
                    .style.display = "none";

            }

        }


        /* =====================================================
           COMPLETE PAYMENT
        ===================================================== */

        async function completePayment() {

            if (!booking) {

                showMessage(
                    "Booking information not found.",
                    "error"
                );

                return;

            }


            if (!selectedMethod) {

                showMessage(
                    "Please select a payment method.",
                    "error"
                );

                return;

            }


            /* ================= UPI VALIDATION ================= */

            if (
                selectedMethod === "UPI"
            ) {

                const upi =
                    document
                        .getElementById(
                            "upiId"
                        )
                        .value
                        .trim();


                if (!upi) {

                    showMessage(
                        "Please enter UPI ID.",
                        "error"
                    );

                    return;

                }

            }


            /* ================= CARD VALIDATION ================= */

            if (
                selectedMethod === "Card"
            ) {

                const cardNumber =
                    document
                        .getElementById(
                            "cardNumber"
                        )
                        .value
                        .replace(/\s/g, "");


                const cardName =
                    document
                        .getElementById(
                            "cardName"
                        )
                        .value
                        .trim();


                const expiry =
                    document
                        .getElementById(
                            "expiry"
                        )
                        .value
                        .trim();


                const cvv =
                    document
                        .getElementById(
                            "cvv"
                        )
                        .value
                        .trim();


                if (
                    cardNumber.length < 12 ||
                    !cardName ||
                    !expiry ||
                    cvv.length < 3
                ) {

                    showMessage(
                        "Please enter valid card details.",
                        "error"
                    );

                    return;

                }

            }


            /* ================= BOOKING ID ================= */

            const bookingId =
                booking.bookingId ||
                booking.booking_id;


            if (!bookingId) {

                showMessage(
                    "Booking ID is missing.",
                    "error"
                );

                return;

            }


            const payButton =
                document.getElementById(
                    "payButton"
                );


            payButton.disabled = true;

            payButton.textContent =
                "Processing Payment...";


            try {


                /* =============================================
                   SEND PAYMENT TO NODE.JS BACKEND
                ============================================= */

                const response =
                    await fetch(

                        API_BASE +
                        "/api/bookings/" +
                        encodeURIComponent(
                            bookingId
                        ) +
                        "/payment",

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    paymentMethod:
                                        selectedMethod

                                })

                        }

                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(

                        data.message ||
                        "Payment failed."

                    );

                }


                /* =============================================
                   UPDATE CURRENT BOOKING
                ============================================= */

                booking.paymentMethod =
                    selectedMethod;


                booking.payment_method =
                    selectedMethod;


                booking.status =
                    "Paid";


                booking.paymentStatus =
                    "Paid";


                sessionStorage.setItem(

                    "currentBooking",

                    JSON.stringify(
                        booking
                    )

                );


                /* =============================================
                   SUCCESS MESSAGE
                ============================================= */

                showMessage(
                    "Payment successful!",
                    "success"
                );


                payButton.textContent =
                    "✓ Payment Successful";


                /* =============================================
                   OPEN SUCCESS PAGE
                ============================================= */

                setTimeout(
                    function() {

                        window.location.href =
                            "booking-success.html";

                    },
                    800
                );


            } catch (error) {

                console.error(
                    "Payment error:",
                    error
                );


                showMessage(

                    error.message ||
                    "Payment failed. Please try again.",

                    "error"

                );


                payButton.disabled =
                    false;


                payButton.textContent =
                    "💳 Pay Now";

            }

        }


        /* =====================================================
           FORMAT CURRENCY
        ===================================================== */

        function formatCurrency(
            amount
        ) {

            const number =
                Number(amount) || 0;


            return (
                "₹" +
                number.toLocaleString(
                    "en-IN"
                )
            );

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.className =
                "message " + type;


            message.style.display =
                "block";

        }


        /* =====================================================
           CARD NUMBER FORMATTING
        ===================================================== */

        document
            .getElementById(
                "cardNumber"
            )
            .addEventListener(
                "input",
                function() {

                    let value =
                        this.value
                            .replace(/\D/g, "")
                            .substring(0, 16);


                    value =
                        value.replace(
                            /(.{4})/g,
                            "$1 "
                        )
                        .trim();


                    this.value =
                        value;

                }
            );


        /* =====================================================
           EXPIRY FORMATTING
        ===================================================== */

        document
            .getElementById(
                "expiry"
            )
            .addEventListener(
                "input",
                function() {

                    let value =
                        this.value
                            .replace(/\D/g, "")
                            .substring(0, 4);


                    if (
                        value.length >= 3
                    ) {

                        value =
                            value.substring(
                                0,
                                2
                            ) +
                            "/" +
                            value.substring(
                                2
                            );

                    }


                    this.value =
                        value;

                }
            );


        /* =====================================================
           CVV NUMBERS ONLY
        ===================================================== */

        document
            .getElementById(
                "cvv"
            )
            .addEventListener(
                "input",
                function() {

                    this.value =
                        this.value
                            .replace(
                                /\D/g,
                                ""
                            )
                            .substring(
                                0,
                                4
                            );

                }
            );

    </script>

</body>

</html>
