<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Karnataka Travel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4faf6;

            color: #333;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            height: 60px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 8%;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .logo {

            font-size: 19px;

            font-weight: bold;

            color: #087f3d;
        }


        .logo span {

            color: #222;
        }


        nav {

            display: flex;

            gap: 20px;
        }


        nav a {

            text-decoration: none;

            color: #333;

            font-size: 13px;

            font-weight: 500;
        }


        nav a:hover {

            color: #087f3d;
        }


        /* =====================================================
           LOGIN PAGE
        ===================================================== */

        .login-page {

            min-height:
                calc(100vh - 60px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;
        }


        /* =====================================================
           LOGIN BOX
        ===================================================== */

        .login-box {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.12);
        }


        /* =====================================================
           ICON
        ===================================================== */

        .login-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .login-title {

            text-align: center;

            color: #087f3d;

            margin: 0 0 7px;

            font-size: 30px;
        }


        .login-subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin: 0 0 27px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            font-weight: bold;

            font-size: 14px;

            margin-bottom: 7px;
        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        .form-group input:focus {

            border-color: #087f3d;

            box-shadow:
                0 0 0 2px
                rgba(8,127,61,0.08);
        }


        /* =====================================================
           PASSWORD AREA
        ===================================================== */

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 48px;
        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .login-options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            font-size: 13px;
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 6px;
        }


        .remember input {

            width: auto;

            accent-color: #087f3d;
        }


        .forgot-link {

            color: #087f3d;

            text-decoration: none;

            font-weight: bold;
        }


        .forgot-link:hover {

            text-decoration: underline;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #087f3d;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #05652f;
        }


        .login-btn:disabled {

            background: #999;

            cursor: not-allowed;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;

            font-weight: bold;

            line-height: 1.4;
        }


        .message.error {

            display: block;

            background: #ffebee;

            color: #c62828;
        }


        .message.success {

            display: block;

            background: #e8f5e9;

            color: #087f3d;
        }


        .message.info {

            display: block;

            background: #e3f2fd;

            color: #1565c0;
        }


        /* =====================================================
           REGISTER
        ===================================================== */

        .register-text {

            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #666;
        }


        .register-text a {

            color: #087f3d;

            text-decoration: none;

            font-weight: bold;
        }


        .register-text a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           HOME
        ===================================================== */

        .home-link {

            text-align: center;

            margin-top: 18px;
        }


        .home-link a {

            color: #555;

            text-decoration: none;

            font-size: 13px;
        }


        .home-link a:hover {

            color: #087f3d;

            text-decoration: underline;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            header {

                padding: 0 15px;
            }


            nav {

                gap: 9px;
            }


            nav a {

                font-size: 10px;
            }


            .login-page {

                padding: 20px 12px;
            }


            .login-box {

                padding: 25px 20px;

                border-radius: 15px;
            }


            .login-title {

                font-size: 25px;
            }


            .login-icon {

                width: 62px;

                height: 62px;

                font-size: 30px;
            }


            .login-options {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">

        🏛️ Karnataka
        <span>Travel</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>

</header>



<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<section class="login-page">


    <div class="login-box">


        <!-- ICON -->

        <div class="login-icon">

            🔐

        </div>


        <!-- TITLE -->

        <h1 class="login-title">

            Welcome Back

        </h1>


        <p class="login-subtitle">

            Login to your Karnataka Travel account

        </p>



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    📧 Email

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                >

            </div>



            <div style="
                text-align:center;
                color:#777;
                font-size:13px;
                margin:-5px 0 15px;
            ">

                OR

            </div>



            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">

                    📱 Mobile Number

                </label>

                <input
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="Enter 10 digit mobile number"
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    🔒 Password

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Show password"
                    >

                        👁️

                    </button>

                </div>

            </div>



            <!-- OPTIONS -->

            <div class="login-options">


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <a
                    href="forgot-password.html"
                    class="forgot-link"
                >

                    Forgot Password?

                </a>


            </div>



            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >

                Login

            </button>


        </form>



        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- REGISTER -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html">

                Create Account

            </a>

        </div>



        <!-- HOME -->

        <div class="home-link">

            <a href="index.html">

                ← Back to Home

            </a>

        </div>


    </div>

</section>



<script>

"use strict";


/* =====================================================
   API URL

   Works on:
   - Computer
   - Mobile
   - Same Wi-Fi network
===================================================== */

const API_BASE =
    window.location.protocol === "file:"
        ? "http://localhost:5000"
        : `${window.location.protocol}//${window.location.hostname}:5000`;



/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById("loginForm");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const emailInput =
    document.getElementById("email");

const mobileInput =
    document.getElementById("mobile");

const passwordInput =
    document.getElementById("password");

const rememberInput =
    document.getElementById("remember");

const showPasswordBtn =
    document.getElementById("showPassword");



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


function clearMessage() {

    message.textContent = "";

    message.className =
        "message";

    message.style.display =
        "none";

}



/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showPasswordBtn.addEventListener(
    "click",
    function() {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            showPasswordBtn.textContent =
                "🙈";

        } else {

            passwordInput.type =
                "password";

            showPasswordBtn.textContent =
                "👁️";

        }

    }
);



/* =====================================================
   MOBILE NUMBER
===================================================== */

mobileInput.addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

    }
);



/* =====================================================
   EMAIL / MOBILE
   User can use either one
===================================================== */

emailInput.addEventListener(
    "input",
    function() {

        if (this.value.trim()) {

            mobileInput.value = "";

        }

    }
);


mobileInput.addEventListener(
    "input",
    function() {

        if (this.value.trim()) {

            emailInput.value = "";

        }

    }
);



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const mobile =
            mobileInput.value
                .replace(/\D/g, "");


        const password =
            passwordInput.value;


        /* =============================================
           VALIDATION
        ============================================= */

        if (!email && !mobile) {

            showMessage(
                "Please enter your email or mobile number.",
                "error"
            );

            return;

        }


        if (
            mobile &&
            mobile.length !== 10
        ) {

            showMessage(
                "Mobile number must contain 10 digits.",
                "error"
            );

            return;

        }


        if (!password) {

            showMessage(
                "Please enter your password.",
                "error"
            );

            return;

        }



        /* =============================================
           BUTTON
        ============================================= */

        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";



        try {


            /* =========================================
               REQUEST
            ========================================= */

            const body = {

                password:
                    password

            };


            if (email) {

                body.email =
                    email;

            } else {

                body.mobile =
                    mobile;

            }



            const response =
                await fetch(
                    API_BASE +
                    "/api/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(body)

                    }
                );



            const data =
                await response.json();



            /* =========================================
               LOGIN FAILED
            ========================================= */

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Login failed."

                );

            }



            /* =========================================
               SAVE USER
            ========================================= */

            if (data.user) {

                sessionStorage.setItem(
                    "loggedIn",
                    "true"
                );


                sessionStorage.setItem(
                    "user",
                    JSON.stringify(
                        data.user
                    )
                );


                sessionStorage.setItem(
                    "userId",
                    String(
                        data.user.id
                    )
                );

            }



            /* =========================================
               REMEMBER ME
            ========================================= */

            if (
                rememberInput.checked
            ) {

                localStorage.setItem(
                    "rememberLogin",
                    "true"
                );

                if (email) {

                    localStorage.setItem(
                        "loginEmail",
                        email
                    );

                } else {

                    localStorage.setItem(
                        "loginMobile",
                        mobile
                    );

                }

            } else {

                localStorage.removeItem(
                    "rememberLogin"
                );

                localStorage.removeItem(
                    "loginEmail"
                );

                localStorage.removeItem(
                    "loginMobile"
                );

            }



            /* =========================================
               SUCCESS
            ========================================= */

            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.replace(
                        "dashboard.html"
                    );

                },
                800
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            let errorMessage =
                error.message ||
                "Login failed.";


            if (
                error instanceof
                TypeError
            ) {

                errorMessage =
                    "Cannot connect to server. Please start Node.js server and check your network.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login";

        }

    }
);



/* =====================================================
   LOAD REMEMBERED LOGIN
===================================================== */

window.addEventListener(
    "load",
    function() {

        const remembered =
            localStorage.getItem(
                "rememberLogin"
            );


        if (
            remembered === "true"
        ) {

            const savedEmail =
                localStorage.getItem(
                    "loginEmail"
                );


            const savedMobile =
                localStorage.getItem(
                    "loginMobile"
                );


            if (savedEmail) {

                emailInput.value =
                    savedEmail;

            }


            if (savedMobile) {

                mobileInput.value =
                    savedMobile;

            }


            rememberInput.checked =
                true;

        }

    }
);

</script>


</body>

</html>
