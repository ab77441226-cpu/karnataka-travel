<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Karnataka Travel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            box-sizing: border-box;
        }

        .login-title {
            text-align: center;
            color: #087f3d;
            margin: 0 0 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #087f3d;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #087f3d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #05652f;
        }

        .login-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            font-weight: bold;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }

        .message.success {
            background: #e8f5e9;
            color: #087f3d;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            color: #087f3d;
            font-weight: bold;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            display: block;
            margin-top: 12px;
        }

        .admin-link {
            display: block;
            margin-top: 12px;
            color: #555 !important;
            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="login-page">

    <div class="login-box">

        <h1 class="login-title">
            🏛️ Karnataka Travel
        </h1>

        <p class="login-subtitle">
            Login to your account
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    📧 Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- OR MOBILE -->

            <div style="
                text-align:center;
                color:#777;
                margin:-5px 0 15px;
                font-weight:bold;
            ">
                OR
            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    📱 Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    placeholder="Enter 10 digit mobile number"
                    autocomplete="tel"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    🔒 Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <!-- MESSAGE -->

        <div
            id="loginMessage"
            class="message"
        ></div>


        <!-- LINKS -->

        <div class="links">

            <div>
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </div>

            <a
                href="forgot-password.html"
                class="forgot-link"
            >
                Forgot Password?
            </a>

            <a
                href="admin-login.html"
                class="admin-link"
            >
                🔐 Admin Login
            </a>

        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   CHECK ALREADY LOGGED-IN USER
========================================================= */

const savedUser =
    sessionStorage.getItem("currentUser");


if (savedUser) {

    try {

        const user =
            JSON.parse(savedUser);

        if (
            user &&
            user.id
        ) {

            window.location.replace(
                "index.html"
            );

        }

    } catch (error) {

        sessionStorage.removeItem(
            "currentUser"
        );

    }

}


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const mobileInput =
    document.getElementById(
        "mobile"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );


/* =========================================================
   MOBILE ONLY NUMBERS
========================================================= */

mobileInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

    }
);


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    text,
    type = "error"
) {

    loginMessage.textContent =
        text;

    loginMessage.className =
        "message " + type;

    loginMessage.style.display =
        "block";

}


/* =========================================================
   HIDE MESSAGE
========================================================= */

function hideMessage() {

    loginMessage.style.display =
        "none";

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        hideMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const mobile =
            mobileInput.value
                .trim();


        const password =
            passwordInput.value;


        /* =====================================================
           VALIDATION
        ===================================================== */

        if (
            !email &&
            !mobile
        ) {

            showMessage(
                "Please enter your email or mobile number."
            );

            return;

        }


        if (
            mobile &&
            !/^[0-9]{10}$/.test(
                mobile
            )
        ) {

            showMessage(
                "Mobile number must contain exactly 10 digits."
            );

            return;

        }


        if (!password) {

            showMessage(
                "Please enter your password."
            );

            return;

        }


        /* =====================================================
           DISABLE BUTTON
        ===================================================== */

        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        try {

            /* =================================================
               SEND LOGIN REQUEST
            ================================================= */

            const loginData = {};


            if (email) {

                loginData.email =
                    email;

            } else {

                loginData.mobile =
                    mobile;

            }


            loginData.password =
                password;


            const response =
                await fetch(
                    "http://localhost:5000/api/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                loginData
                            )

                    }
                );


            /* =================================================
               READ RESPONSE
            ================================================= */

            const data =
                await response.json();


            console.log(
                "Login response:",
                data
            );


            /* =================================================
               LOGIN ERROR
            ================================================= */

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Invalid email/mobile or password."
                );

            }


            /* =================================================
               USER VALIDATION
            ================================================= */

            const user =
                data.user;


            if (
                !user ||
                !user.id
            ) {

                throw new Error(
                    "Invalid user information received from server."
                );

            }


            /* =================================================
               SAVE USER
            ================================================= */

            sessionStorage.setItem(
                "currentUser",
                JSON.stringify({
                    id:
                        user.id,

                    name:
                        user.name || "",

                    email:
                        user.email || "",

                    mobile:
                        user.mobile || ""
                })
            );


            /* =================================================
               SUCCESS
            ================================================= */

            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            loginBtn.textContent =
                "Login Successful";


            /* =================================================
               GO HOME
            ================================================= */

            setTimeout(
                function () {

                    window.location.replace(
                        "index.html"
                    );

                },
                500
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            /* =================================================
               CONNECTION ERROR
            ================================================= */

            if (
                error instanceof TypeError
            ) {

                showMessage(
                    "Cannot connect to server. Please start your Node.js server on port 5000."
                );

            } else {

                showMessage(
                    error.message ||
                    "Login failed."
                );

            }


            /* =================================================
               ENABLE BUTTON
            ================================================= */

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login";

        }

    }
);

</script>

</body>

</html>
