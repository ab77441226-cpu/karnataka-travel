<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Karnataka Travel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
            color: #333;
        }

        /* HEADER */

        header {
            height: 60px;
            background: white;
            padding: 0 10%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #087f3d;
        }

        .logo span {
            color: #222;
        }

        nav {
            display: flex;
            gap: 18px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 13px;
        }

        nav a:hover {
            color: #087f3d;
        }

        /* LOGIN PAGE */

        .login-page {
            min-height: calc(100vh - 60px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 28px;

            border-radius: 18px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.12);
        }

        .login-icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 12px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {
            text-align: center;

            color: #087f3d;

            margin: 0 0 5px;

            font-size: 26px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 22px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 6px;

            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #087f3d;

            box-shadow:
                0 0 0 2px rgba(8,127,61,0.08);
        }

        .or {
            text-align: center;

            color: #777;

            font-size: 12px;

            margin: 5px 0 12px;
        }

        /* OPTIONS */

        .options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 5px 0 18px;

            font-size: 12px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #087f3d;

            text-decoration: none;

            font-weight: bold;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #087f3d;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #05652f;
        }

        .login-btn:disabled {
            background: #8ab99d;

            cursor: not-allowed;
        }

        /* MESSAGE */

        .message {
            display: none;

            padding: 11px;

            margin-bottom: 15px;

            border-radius: 7px;

            text-align: center;

            font-size: 13px;

            font-weight: bold;
        }

        .success {
            display: block;

            background: #e8f5ed;

            color: #087f3d;
        }

        .error {
            display: block;

            background: #ffebee;

            color: #c62828;
        }

        /* REGISTER */

        .register-text {
            text-align: center;

            margin-top: 18px;

            font-size: 12px;

            color: #666;
        }

        .register-text a {
            color: #087f3d;

            font-weight: bold;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 14px;

            color: #777;

            text-decoration: none;

            font-size: 11px;
        }

        .back-home:hover {
            color: #087f3d;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 0 15px;
            }

            .logo {
                font-size: 16px;
            }

            nav {
                gap: 8px;
            }

            nav a {
                font-size: 11px;
            }

            .login-box {
                padding: 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🏛️ Karnataka <span>Travel</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- LOGIN -->

    <section class="login-page">

        <div class="login-box">

            <div class="login-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to your Karnataka Travel account
            </p>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="or">
                    OR
                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        📱 Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- OPTIONS -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>


                    <a
                        href="forgot-password.html"
                        class="forgot">

                        Forgot Password?

                    </a>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn">

                    Login

                </button>

            </form>


            <!-- REGISTER -->

            <div class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </section>


    <script>

        "use strict";


        /* =====================================================
           API URL
        ===================================================== */

        const API_BASE =
            window.location.protocol === "file:"
                ? "http://localhost:5000"
                : `${window.location.protocol}//${window.location.hostname}:5000`;


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById("loginForm");

        const loginBtn =
            document.getElementById("loginBtn");

        const message =
            document.getElementById("message");

        const emailInput =
            document.getElementById("email");

        const mobileInput =
            document.getElementById("mobile");

        const passwordInput =
            document.getElementById("password");


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

            message.style.display = "block";
        }


        /* =====================================================
           HIDE MESSAGE
        ===================================================== */

        function hideMessage() {

            message.textContent = "";

            message.className = "message";

            message.style.display = "none";
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                hideMessage();


                const email =
                    emailInput.value.trim();

                const mobile =
                    mobileInput.value.trim();

                const password =
                    passwordInput.value;


                /* PASSWORD CHECK */

                if (!password) {

                    showMessage(
                        "Please enter your password.",
                        "error"
                    );

                    return;
                }


                /* EMAIL OR MOBILE CHECK */

                if (!email && !mobile) {

                    showMessage(
                        "Please enter email or mobile number.",
                        "error"
                    );

                    return;
                }


                /* MOBILE VALIDATION */

                if (
                    mobile &&
                    !/^[0-9]{10}$/.test(mobile)
                ) {

                    showMessage(
                        "Please enter a valid 10 digit mobile number.",
                        "error"
                    );

                    return;
                }


                /* BUTTON LOADING */

                loginBtn.disabled = true;

                loginBtn.textContent =
                    "Logging in...";


                try {

                    /* =========================================
                       SEND LOGIN REQUEST
                    ========================================= */

                    const response =
                        await fetch(
                            API_BASE + "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email:
                                        email || null,

                                    mobile:
                                        mobile || null,

                                    password:
                                        password

                                })
                            }
                        );


                    /* RESPONSE */

                    const data =
                        await response.json();


                    console.log(
                        "Login response:",
                        data
                    );


                    /* LOGIN FAILED */

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Invalid email/mobile or password."
                        );

                    }


                    /* =========================================
                       GET USER
                    ========================================= */

                    const user =
                        data.user;


                    if (
                        !user ||
                        !user.id
                    ) {

                        throw new Error(
                            "Login successful, but user data was not received."
                        );

                    }


                    /* =========================================
                       SAVE LOGIN USER
                    ========================================= */

                    sessionStorage.setItem(
                        "user",
                        JSON.stringify(user)
                    );


                    /* =========================================
                       ALSO SAVE USER ID
                    ========================================= */

                    sessionStorage.setItem(
                        "userId",
                        String(user.id)
                    );


                    /* =========================================
                       SUCCESS
                    ========================================= */

                    showMessage(
                        "Login successful! Redirecting...",
                        "success"
                    );


                    loginBtn.textContent =
                        "Login Successful";


                    /* =========================================
                       GO HOME
                    ========================================= */

                    setTimeout(
                        function() {

                            window.location.href =
                                "index.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to login. Please try again.",
                        "error"
                    );


                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        "Login";

                }

            }
        );


        /* =====================================================
           IF ALREADY LOGGED IN
        ===================================================== */

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                const savedUser =
                    sessionStorage.getItem("user");


                if (savedUser) {

                    try {

                        const user =
                            JSON.parse(savedUser);


                        if (user && user.id) {

                            console.log(
                                "User already logged in:",
                                user
                            );

                        }

                    } catch (error) {

                        sessionStorage.removeItem(
                            "user"
                        );

                        sessionStorage.removeItem(
                            "userId"
                        );

                    }

                }

            }
        );

    </script>

</body>
</html>
