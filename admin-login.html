<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Karnataka Travel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
        }

        .admin-login-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .admin-login-box {

            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.12);
        }

        .admin-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        .admin-title {

            text-align: center;

            color: #087f3d;

            margin: 0 0 8px;

            font-size: 30px;
        }

        .admin-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 28px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        .form-group label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {

            border-color: #087f3d;
        }

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #087f3d;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {

            background: #05652f;
        }

        .login-btn:disabled {

            background: #999;

            cursor: not-allowed;
        }

        .message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;
        }

        .error {

            display: block;

            background: #ffebee;

            color: #c62828;
        }

        .success {

            display: block;

            background: #e8f5e9;

            color: #087f3d;
        }

        .back-link {

            text-align: center;

            margin-top: 22px;
        }

        .back-link a {

            color: #087f3d;

            text-decoration: none;

            font-weight: bold;
        }

        .back-link a:hover {

            text-decoration: underline;
        }

        .admin-note {

            margin-top: 20px;

            padding: 12px;

            background: #fff8e1;

            color: #795548;

            border-radius: 8px;

            font-size: 13px;

            text-align: center;
        }

    </style>

</head>


<body>


<div class="admin-login-page">


    <div class="admin-login-box">


        <div class="admin-icon">

            🔐

        </div>


        <h1 class="admin-title">

            Karnataka Travel

        </h1>


        <p class="admin-subtitle">

            Admin Login

        </p>


        <form id="adminLoginForm">


            <div class="form-group">

                <label for="email">

                    📧 Admin Email

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">

                    🔒 Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >

                Admin Login

            </button>


        </form>


        <div
            id="loginMessage"
            class="message"
        ></div>


        <div class="back-link">

            <a href="index.html">

                ← Back to Home

            </a>

        </div>


        <div class="admin-note">

            🔒 This page is only for Karnataka Travel administrators.

        </div>


    </div>


</div>



<script>

"use strict";


/* =====================================================
   API URL

   Computer:
   http://localhost:5000

   Phone:
   http://192.168.1.103:5000

   Current page hostname is used automatically.
===================================================== */

const API_BASE =
    window.location.protocol === "file:"
        ? "http://192.168.1.103:5000"
        : `${window.location.protocol}//${window.location.hostname}:5000`;


/* =====================================================
   ALREADY LOGGED IN
===================================================== */

if (
    sessionStorage.getItem("adminLoggedIn") === "true"
) {

    window.location.replace(
        "admin.html"
    );

}


/* =====================================================
   FORM
===================================================== */

const adminLoginForm =
    document.getElementById(
        "adminLoginForm"
    );


adminLoginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        if (
            !email ||
            !password
        ) {

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try {


            /* =========================================
               ADMIN LOGIN API
            ========================================= */

            const response =
                await fetch(
                    API_BASE +
                    "/api/admin/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Invalid admin email or password."

                );

            }


            /* =========================================
               SAVE ADMIN LOGIN
            ========================================= */

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            if (data.admin) {

                sessionStorage.setItem(
                    "adminUser",
                    JSON.stringify(
                        data.admin
                    )
                );

            }


            showMessage(
                "Admin login successful. Opening dashboard...",
                "success"
            );


            /* =========================================
               OPEN ADMIN DASHBOARD
            ========================================= */

            setTimeout(
                function() {

                    window.location.replace(
                        "admin.html"
                    );

                },
                500
            );


        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            let message =
                error.message ||
                "Admin login failed.";


            if (
                error instanceof
                TypeError
            ) {

                message =
                    "Cannot connect to server. Please start Node.js server and check Wi-Fi.";

            }


            showMessage(
                message,
                "error"
            );


            loginBtn.disabled =
                false;


            loginBtn.textContent =
                "Admin Login";

        }

    }
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "loginMessage"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";

}

</script>


</body>

</html>
