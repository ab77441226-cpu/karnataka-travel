<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Karnataka Travel</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4faf6,
                    #e8f5ed
                );

            color: #333;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .admin-login-page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* =====================================================
           LOGIN BOX
        ===================================================== */

        .admin-login-box {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.12);
        }


        /* =====================================================
           ICON
        ===================================================== */

        .admin-icon {

            width: 78px;

            height: 78px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 40px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .admin-title {

            margin: 0;

            text-align: center;

            color: #087f3d;

            font-size: 30px;
        }


        .admin-subtitle {

            margin:
                8px 0 28px;

            text-align: center;

            color: #777;

            font-size: 15px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition:
                0.2s;
        }


        .form-group input:focus {

            border-color: #087f3d;

            box-shadow:
                0 0 0 3px
                rgba(8, 127, 61, 0.10);
        }


        /* =====================================================
           PASSWORD WRAPPER
        ===================================================== */

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 50px;
        }


        .show-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 20px;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #087f3d;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s;
        }


        .login-btn:hover {

            background: #05652f;
        }


        .login-btn:disabled {

            background: #999;

            cursor: not-allowed;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.4;
        }


        .message.success {

            display: block;

            background: #e8f5e9;

            color: #087f3d;
        }


        .message.error {

            display: block;

            background: #ffebee;

            color: #c62828;
        }


        /* =====================================================
           BACK LINK
        ===================================================== */

        .back-link {

            margin-top: 22px;

            text-align: center;
        }


        .back-link a {

            color: #087f3d;

            text-decoration: none;

            font-weight: bold;
        }


        .back-link a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           ADMIN NOTE
        ===================================================== */

        .admin-note {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #fff8e1;

            color: #795548;

            text-align: center;

            font-size: 12px;

            line-height: 1.5;
        }


        /* =====================================================
           SERVER STATUS
        ===================================================== */

        .server-status {

            margin-top: 15px;

            text-align: center;

            font-size: 12px;

            color: #777;
        }


        .status-dot {

            display: inline-block;

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: #999;

            margin-right: 5px;
        }


        .status-dot.online {

            background: #087f3d;
        }


        .status-dot.offline {

            background: #c62828;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .admin-login-page {

                padding: 15px;
            }


            .admin-login-box {

                padding: 25px 20px;

                border-radius: 15px;
            }


            .admin-icon {

                width: 65px;

                height: 65px;

                font-size: 32px;
            }


            .admin-title {

                font-size: 25px;
            }


            .admin-subtitle {

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     ADMIN LOGIN PAGE
===================================================== -->

<div class="admin-login-page">


    <div class="admin-login-box">


        <!-- ICON -->

        <div class="admin-icon">

            🔐

        </div>


        <!-- TITLE -->

        <h1 class="admin-title">

            Karnataka Travel

        </h1>


        <p class="admin-subtitle">

            Administrator Login

        </p>


        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form id="adminLoginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    📧 Admin Email

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    🔒 Password

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Show password"
                    >

                        👁️

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >

                🔐 Admin Login

            </button>


        </form>


        <!-- MESSAGE -->

        <div
            id="loginMessage"
            class="message"
        ></div>


        <!-- SERVER STATUS -->

        <div class="server-status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="serverStatus">

                Checking server...

            </span>

        </div>


        <!-- BACK -->

        <div class="back-link">

            <a href="index.html">

                ← Back to Home

            </a>

        </div>


        <!-- NOTE -->

        <div class="admin-note">

            🔒 This page is only for
            Karnataka Travel administrators.

        </div>


    </div>

</div>



<script>

"use strict";


/* =====================================================
   API BASE URL

   IMPORTANT:

   Same computer:
   http://localhost:5000

   Mobile / Tablet:
   http://YOUR-PC-IP:5000

   Example:
   http://192.168.1.103:5000

   This code automatically uses the hostname
   from the browser.

===================================================== */

const API_BASE =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1"
        ? `${window.location.protocol}//${window.location.hostname}:5000`
        : `${window.location.protocol}//${window.location.hostname}:5000`;


/* =====================================================
   ELEMENTS
===================================================== */

const adminLoginForm =
    document.getElementById(
        "adminLoginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const showPassword =
    document.getElementById(
        "showPassword"
    );


const serverStatus =
    document.getElementById(
        "serverStatus"
    );


const statusDot =
    document.getElementById(
        "statusDot"
    );


/* =====================================================
   CHECK EXISTING ADMIN LOGIN
===================================================== */

if (
    sessionStorage.getItem(
        "adminLoggedIn"
    ) === "true"
) {

    window.location.replace(
        "admin.html"
    );

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

showPassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            showPassword.textContent =
                "🙈";

        } else {

            passwordInput.type =
                "password";

            showPassword.textContent =
                "👁️";

        }

    }
);


/* =====================================================
   CHECK SERVER
===================================================== */

async function checkServer() {

    try {

        const response =
            await fetch(
                API_BASE +
                "/api/test-db",
                {
                    method: "GET"
                }
            );


        const data =
            await response.json();


        if (
            response.ok &&
            data.success
        ) {

            serverStatus.textContent =
                "Server connected";

            statusDot.classList.add(
                "online"
            );

            statusDot.classList.remove(
                "offline"
            );

        } else {

            throw new Error(
                "Server error"
            );

        }

    }

    catch (error) {

        serverStatus.textContent =
            "Server not connected";

        statusDot.classList.add(
            "offline"
        );

        statusDot.classList.remove(
            "online"
        );

    }

}


/* =====================================================
   CHECK SERVER ON PAGE LOAD
===================================================== */

checkServer();


/* =====================================================
   ADMIN LOGIN
===================================================== */

adminLoginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        /* =============================================
           VALIDATION
        ============================================= */

        if (!email) {

            showMessage(
                "Please enter admin email.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if (!password) {

            showMessage(
                "Please enter password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        /* =============================================
           BUTTON
        ============================================= */

        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        loginMessage.style.display =
            "none";


        /* =============================================
           API
        ============================================= */

        try {

            const response =
                await fetch(
                    API_BASE +
                    "/api/admin/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            /* =========================================
               RESPONSE
            ========================================= */

            let data;


            try {

                data =
                    await response.json();

            }

            catch (jsonError) {

                throw new Error(
                    "Invalid response from server."
                );

            }


            /* =========================================
               LOGIN ERROR
            ========================================= */

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Invalid admin email or password."

                );

            }


            /* =========================================
               SAVE LOGIN
            ========================================= */

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            if (data.admin) {

                sessionStorage.setItem(

                    "adminUser",

                    JSON.stringify(
                        data.admin
                    )

                );

            }


            /* =========================================
               SUCCESS
            ========================================= */

            showMessage(

                "✅ Admin login successful. Opening dashboard...",

                "success"

            );


            /* =========================================
               REDIRECT
            ========================================= */

            setTimeout(
                function () {

                    window.location.replace(
                        "admin.html"
                    );

                },
                700
            );

        }


        catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            let message =
                error.message ||
                "Admin login failed.";


            /* =========================================
               CONNECTION ERROR
            ========================================= */

            if (
                error instanceof
                TypeError
            ) {

                message =
                    "❌ Cannot connect to server. Make sure Node.js server is running and both devices are on the same Wi-Fi.";

            }


            showMessage(
                message,
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "🔐 Admin Login";


            checkServer();

        }

    }
);


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    loginMessage.textContent =
        text;


    loginMessage.className =
        "message " + type;


    loginMessage.style.display =
        "block";

}


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            adminLoginForm.requestSubmit();

        }

    }
);

</script>


</body>

</html>
