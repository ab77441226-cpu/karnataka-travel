<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Karnataka Travel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
            color: #333;
        }

        .register-page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.12);
        }

        .register-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        .title {
            text-align: center;

            color: #087f3d;

            margin: 0 0 7px;

            font-size: 30px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #087f3d;

            box-shadow:
                0 0 0 2px
                rgba(8, 127, 61, 0.08);
        }

        .register-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #087f3d;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #05652f;
        }

        .register-btn:disabled {
            background: #999;

            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

            line-height: 1.4;
        }

        .message.success {
            display: block;

            background: #e8f5e9;

            color: #087f3d;
        }

        .message.error {
            display: block;

            background: #ffebee;

            color: #c62828;
        }

        .login-link {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;
        }

        .login-link a {
            color: #087f3d;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            text-align: center;

            margin-top: 12px;

            font-size: 13px;
        }

        .home-link a {
            color: #555;

            text-decoration: none;
        }

        .home-link a:hover {
            color: #087f3d;
        }

        .password-note {
            color: #777;

            font-size: 11px;

            margin-top: 5px;
        }

        @media (max-width: 500px) {

            .register-page {
                padding: 15px;
            }

            .register-box {
                padding: 25px 20px;
            }

            .title {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<div class="register-page">


    <div class="register-box">


        <!-- ICON -->

        <div class="register-icon">
            👤
        </div>


        <!-- TITLE -->

        <h1 class="title">
            Karnataka Travel
        </h1>


        <p class="subtitle">
            Create your account
        </p>


        <!-- REGISTER FORM -->

        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    👤 Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    📧 Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    📱 Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    🔒 Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <div class="password-note">
                    Password must contain at least 6 characters.
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    🔐 Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
                id="registerBtn">

                Create Account

            </button>


        </form>


        <!-- MESSAGE -->

        <div
            id="registerMessage"
            class="message">
        </div>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <!-- HOME -->

        <div class="home-link">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>


    </div>

</div>



<script>

"use strict";


/* =====================================================
   API BASE URL

   Same computer:
   http://localhost:5000

   Other device:
   Automatically uses the computer IP when page
   is opened through the computer's network address.
===================================================== */

const API_BASE =
    window.location.protocol === "file:"
        ? "http://localhost:5000"
        : `${window.location.protocol}//${window.location.hostname}:5000`;


/* =====================================================
   ELEMENTS
===================================================== */

const registerForm =
    document.getElementById("registerForm");

const registerBtn =
    document.getElementById("registerBtn");

const registerMessage =
    document.getElementById("registerMessage");


/* =====================================================
   MOBILE INPUT
   Only numbers
===================================================== */

document.getElementById("mobile")
    .addEventListener("input", function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

    });


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type) {

    registerMessage.textContent = text;

    registerMessage.className =
        "message " + type;

    registerMessage.style.display =
        "block";
}


/* =====================================================
   REGISTER
===================================================== */

registerForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        /* ---------------------------------------------
           GET VALUES
        --------------------------------------------- */

        const name =
            document.getElementById("name")
                .value.trim();

        const email =
            document.getElementById("email")
                .value.trim()
                .toLowerCase();

        const mobile =
            document.getElementById("mobile")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
                .value;


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if (!name) {

            showMessage(
                "Please enter your name.",
                "error"
            );

            return;
        }


        if (name.length < 2) {

            showMessage(
                "Name must contain at least 2 characters.",
                "error"
            );

            return;
        }


        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;
        }


        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(email)) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            return;
        }


        if (!/^[0-9]{10}$/.test(mobile)) {

            showMessage(
                "Mobile number must contain exactly 10 digits.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        /* ---------------------------------------------
           DISABLE BUTTON
        --------------------------------------------- */

        registerBtn.disabled = true;

        registerBtn.textContent =
            "Creating Account...";


        try {


            /* -----------------------------------------
               API REQUEST
            ----------------------------------------- */

            const response =
                await fetch(
                    API_BASE + "/api/register",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name: name,

                                email: email,

                                mobile: mobile,

                                password: password

                            })

                    }
                );


            /* -----------------------------------------
               RESPONSE
            ----------------------------------------- */

            let data;

            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "Invalid server response."
                );

            }


            /* -----------------------------------------
               ERROR
            ----------------------------------------- */

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Registration failed."

                );

            }


            /* -----------------------------------------
               SAVE USER DATA
            ----------------------------------------- */

            if (data.user) {

                sessionStorage.setItem(
                    "user",
                    JSON.stringify(
                        data.user
                    )
                );


                if (data.user.id) {

                    sessionStorage.setItem(
                        "userId",
                        String(data.user.id)
                    );

                }

            }


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            showMessage(
                "Registration successful! Opening login page...",
                "success"
            );


            registerForm.reset();


            /* -----------------------------------------
               GO TO LOGIN
            ----------------------------------------- */

            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                1200
            );


        } catch (error) {


            console.error(
                "Registration error:",
                error
            );


            let message =
                error.message ||
                "Registration failed.";


            /* -----------------------------------------
               CONNECTION ERROR
            ----------------------------------------- */

            if (
                error instanceof TypeError ||
                message.includes("Failed to fetch")
            ) {

                message =
                    "Cannot connect to server. " +
                    "Please start the Node.js server " +
                    "and check the computer IP/Wi-Fi.";

            }


            showMessage(
                message,
                "error"
            );


            /* -----------------------------------------
               ENABLE BUTTON
            ----------------------------------------- */

            registerBtn.disabled =
                false;

            registerBtn.textContent =
                "Create Account";

        }

    }
);

</script>


</body>

</html>
