<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Karnataka Travel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
            color: #333;
        }

        /* HEADER */

        header {
            background: white;
            height: 60px;
            padding: 0 8%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #087f3d;
        }

        .logo span {
            color: #222;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        nav a:hover {
            color: #087f3d;
        }

        /* PAGE */

        .profile-page {
            min-height: calc(100vh - 60px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        /* PROFILE BOX */

        .profile-box {
            width: 100%;
            max-width: 550px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.12);
        }

        /* ICON */

        .profile-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
        }

        h1 {
            text-align: center;

            color: #087f3d;

            margin: 0 0 5px;

            font-size: 28px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        /* USER DETAILS */

        .profile-details {
            background: #f4faf6;

            border-radius: 12px;

            padding: 10px 18px;
        }

        .profile-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 15px 0;

            border-bottom: 1px solid #d7e3dc;
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;

            color: #666;

            font-size: 14px;
        }

        .value {
            font-weight: bold;

            color: #222;

            font-size: 14px;

            text-align: right;

            word-break: break-word;
        }

        /* BUTTONS */

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        .btn {
            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            text-align: center;

            text-decoration: none;
        }

        .home-btn {
            background: #087f3d;

            color: white;
        }

        .home-btn:hover {
            background: #05652f;
        }

        .history-btn {
            background: #eeeeee;

            color: #333;
        }

        .history-btn:hover {
            background: #dddddd;
        }

        .logout-btn {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #c62828;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: #a91f1f;
        }

        /* MESSAGE */

        .message {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            font-size: 14px;
        }

        .error {
            display: block;

            background: #ffebee;

            color: #c62828;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 0 15px;
            }

            .logo {
                font-size: 16px;
            }

            nav {
                gap: 8px;
            }

            nav a {
                font-size: 11px;
            }

            .profile-page {
                padding: 20px 12px;
            }

            .profile-box {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }

            .profile-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 5px;
            }

            .value {
                text-align: left;
            }

            .buttons {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🏛️ Karnataka <span>Travel</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="booking-history.html">
                Bookings
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </header>


    <!-- PROFILE -->

    <section class="profile-page">

        <div class="profile-box">

            <div class="profile-icon">
                👤
            </div>

            <h1>
                My Profile
            </h1>

            <p class="subtitle">
                Your Karnataka Travel account details
            </p>


            <!-- DETAILS -->

            <div class="profile-details">

                <div class="profile-row">

                    <span class="label">
                        User ID
                    </span>

                    <span
                        class="value"
                        id="userId">
                        -
                    </span>

                </div>


                <div class="profile-row">

                    <span class="label">
                        Name
                    </span>

                    <span
                        class="value"
                        id="userName">
                        Loading...
                    </span>

                </div>


                <div class="profile-row">

                    <span class="label">
                        Email
                    </span>

                    <span
                        class="value"
                        id="userEmail">
                        Loading...
                    </span>

                </div>


                <div class="profile-row">

                    <span class="label">
                        Mobile
                    </span>

                    <span
                        class="value"
                        id="userMobile">
                        Loading...
                    </span>

                </div>


                <div class="profile-row">

                    <span class="label">
                        Account Created
                    </span>

                    <span
                        class="value"
                        id="createdAt">
                        -
                    </span>

                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="index.html"
                    class="btn home-btn">

                    🏠 Home

                </a>


                <a
                    href="booking-history.html"
                    class="btn history-btn">

                    📋 My Bookings

                </a>

            </div>


            <button
                type="button"
                class="logout-btn"
                onclick="logout()">

                🚪 Logout

            </button>

        </div>

    </section>


    <script>

        "use strict";


        /* =====================================================
           API URL

           Same computer:
           http://localhost:5000

           Other device:
           Automatically uses computer hostname/IP
        ===================================================== */

        const API_BASE =
            window.location.protocol === "file:"
                ? "http://192.168.1.103:5000"
                : `${window.location.protocol}//${window.location.hostname}:5000`;


        /* =====================================================
           GET LOGIN USER
        ===================================================== */

        let user = null;


        const userString =
            sessionStorage.getItem("user");


        if (userString) {

            try {

                user =
                    JSON.parse(userString);

            } catch (error) {

                console.error(
                    "User data error:",
                    error
                );

                user = null;

            }

        }


        /* =====================================================
           IF USER NOT LOGGED IN
        ===================================================== */

        if (!user || !user.id) {

            showMessage(
                "Please login first.",
                "error"
            );

            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1000
            );

        } else {

            loadProfile();

        }


        /* =====================================================
           LOAD PROFILE
        ===================================================== */

        async function loadProfile() {

            try {

                const response =
                    await fetch(
                        API_BASE +
                        "/api/profile/" +
                        encodeURIComponent(user.id)
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(

                        data.message ||
                        "Unable to load profile."

                    );

                }


                const profile =
                    data.user;


                /* USER ID */

                document.getElementById(
                    "userId"
                ).textContent =
                    profile.id || "-";


                /* NAME */

                document.getElementById(
                    "userName"
                ).textContent =
                    profile.name || "-";


                /* EMAIL */

                document.getElementById(
                    "userEmail"
                ).textContent =
                    profile.email || "-";


                /* MOBILE */

                document.getElementById(
                    "userMobile"
                ).textContent =
                    profile.mobile || "-";


                /* CREATED DATE */

                document.getElementById(
                    "createdAt"
                ).textContent =
                    formatDate(
                        profile.created_at
                    );


                /* UPDATE SESSION */

                sessionStorage.setItem(
                    "user",
                    JSON.stringify(profile)
                );


            } catch (error) {

                console.error(
                    "Profile error:",
                    error
                );


                showMessage(

                    error.message ||
                    "Unable to load profile.",

                    "error"

                );

            }

        }


        /* =====================================================
           DATE FORMAT
        ===================================================== */

        function formatDate(dateValue) {

            if (!dateValue) {

                return "-";

            }


            const date =
                new Date(dateValue);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return dateValue;

            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function logout() {

            sessionStorage.removeItem(
                "user"
            );

            sessionStorage.removeItem(
                "currentBooking"
            );

            sessionStorage.removeItem(
                "adminLoggedIn"
            );

            sessionStorage.removeItem(
                "adminUser"
            );


            window.location.href =
                "login.html";

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showMessage(
            text,
            type
        ) {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.className =
                "message " + type;


            message.style.display =
                "block";

        }

    </script>

</body>
</html>
