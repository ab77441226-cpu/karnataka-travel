<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Karnataka Travel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
        }

        /* =========================================
           HEADER
        ========================================= */

        .admin-header {

            background: #087f3d;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }

        .admin-logo {

            font-size: 24px;

            font-weight: bold;
        }

        .admin-logo span {

            color: #d9f5e4;
        }

        .admin-nav {

            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        .admin-nav a {

            color: white;

            text-decoration: none;

            padding: 9px 13px;

            border-radius: 6px;
        }

        .admin-nav a:hover {

            background: rgba(255,255,255,0.15);
        }

        .logout-btn {

            border: none;

            background: #c62828;

            color: white;

            padding: 10px 16px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .logout-btn:hover {

            background: #a91f1f;
        }

        /* =========================================
           PAGE
        ========================================= */

        .admin-page {

            padding: 35px 20px;

            max-width: 1250px;

            margin: auto;
        }

        .page-title {

            color: #087f3d;

            margin-bottom: 5px;
        }

        .page-subtitle {

            color: #666;

            margin-top: 0;

            margin-bottom: 25px;
        }

        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            display: none;

            padding: 13px;

            margin-bottom: 20px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;
        }

        .success {

            display: block;

            background: #e8f5e9;

            color: #087f3d;
        }

        .error {

            display: block;

            background: #ffebee;

            color: #c62828;
        }

        /* =========================================
           STATISTICS
        ========================================= */

        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }

        .stat-card {

            background: white;

            padding: 22px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.10);
        }

        .stat-icon {

            font-size: 30px;

            margin-bottom: 8px;
        }

        .stat-label {

            color: #777;

            font-size: 14px;

            margin-bottom: 6px;
        }

        .stat-value {

            color: #087f3d;

            font-size: 27px;

            font-weight: bold;
        }

        /* =========================================
           BOOKINGS SECTION
        ========================================= */

        .bookings-box {

            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.10);
        }

        .bookings-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;
        }

        .bookings-header h2 {

            margin: 0;

            color: #087f3d;
        }

        .refresh-btn {

            border: none;

            background: #087f3d;

            color: white;

            padding: 10px 15px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .refresh-btn:hover {

            background: #05652f;
        }

        /* =========================================
           SEARCH
        ========================================= */

        .search-row {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }

        #searchBooking {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        #searchBooking:focus {

            border-color: #087f3d;
        }

        /* =========================================
           BOOKING CARD
        ========================================= */

        .booking-card {

            border: 1px solid #e0e0e0;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 18px;

            background: #fff;
        }

        .booking-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            border-bottom: 1px solid #eee;

            padding-bottom: 13px;

            margin-bottom: 15px;
        }

        .booking-id {

            color: #087f3d;

            font-size: 18px;

            font-weight: bold;
        }

        .status {

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }

        .status.paid {

            background: #e8f5e9;

            color: #087f3d;
        }

        .status.pending {

            background: #fff3e0;

            color: #ef6c00;
        }

        .booking-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px 25px;
        }

        .detail {

            padding: 5px 0;

            color: #555;
        }

        .detail strong {

            color: #222;
        }

        .booking-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-top: 18px;

            padding-top: 15px;

            border-top: 1px solid #eee;
        }

        .booking-total {

            color: #087f3d;

            font-size: 20px;

            font-weight: bold;
        }

        .delete-btn {

            border: none;

            background: #c62828;

            color: white;

            padding: 9px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .delete-btn:hover {

            background: #a91f1f;
        }

        /* =========================================
           CLEAR ALL
        ========================================= */

        .clear-section {

            margin-top: 25px;

            text-align: right;
        }

        .clear-btn {

            border: none;

            background: #c62828;

            color: white;

            padding: 12px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .clear-btn:hover {

            background: #a91f1f;
        }

        /* =========================================
           EMPTY
        ========================================= */

        .empty {

            text-align: center;

            padding: 45px 20px;

            color: #777;
        }

        .empty-icon {

            font-size: 50px;

            margin-bottom: 10px;
        }

        /* =========================================
           LOADING
        ========================================= */

        .loading {

            text-align: center;

            padding: 35px;

            color: #666;

            font-weight: bold;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 900px) {

            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .admin-header {

                flex-direction: column;

                align-items: stretch;

                text-align: center;

                padding: 15px;
            }

            .admin-nav {

                justify-content: center;
            }

            .admin-page {

                padding: 25px 12px;
            }

            .stats-grid {

                grid-template-columns: 1fr;
            }

            .bookings-header {

                flex-direction: column;

                align-items: stretch;
            }

            .booking-details {

                grid-template-columns: 1fr;
            }

            .booking-top {

                flex-direction: column;

                align-items: flex-start;
            }

            .booking-bottom {

                flex-direction: column;

                align-items: stretch;
            }

            .delete-btn {

                width: 100%;
            }

            .clear-btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="admin-header">


    <div class="admin-logo">

        🏛️ Karnataka
        <span>Travel Admin</span>

    </div>


    <div class="admin-nav">

        <a href="index.html">

            🏠 Home

        </a>


        <a href="district.html">

            📍 Districts

        </a>


        <button
            id="logoutBtn"
            class="logout-btn"
        >

            Logout

        </button>

    </div>


</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="admin-page">


    <h1 class="page-title">

        📊 Admin Dashboard

    </h1>


    <p class="page-subtitle">

        Manage Karnataka Travel bookings

    </p>


    <div
        id="adminMessage"
        class="message"
    ></div>


    <!-- =========================================
         STATISTICS
    ========================================== -->

    <div class="stats-grid">


        <div class="stat-card">

            <div class="stat-icon">

                📋

            </div>

            <div class="stat-label">

                Total Bookings

            </div>

            <div
                id="totalBookings"
                class="stat-value"
            >

                0

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">

                💰

            </div>

            <div class="stat-label">

                Total Revenue

            </div>

            <div
                id="totalRevenue"
                class="stat-value"
            >

                ₹0

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">

                🚌

            </div>

            <div class="stat-label">

                Vehicle Bookings

            </div>

            <div
                id="vehicleBookings"
                class="stat-value"
            >

                0

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">

                📍

            </div>

            <div class="stat-label">

                Destinations

            </div>

            <div
                id="destinationCount"
                class="stat-value"
            >

                0

            </div>

        </div>


    </div>



    <!-- =========================================
         BOOKINGS
    ========================================== -->

    <section class="bookings-box">


        <div class="bookings-header">


            <h2>

                📋 All Bookings

            </h2>


            <button
                id="refreshBtn"
                class="refresh-btn"
            >

                🔄 Refresh

            </button>


        </div>



        <!-- SEARCH -->

        <div class="search-row">

            <input
                type="text"
                id="searchBooking"
                placeholder="Search by name, mobile, destination or booking ID..."
            >

        </div>



        <!-- BOOKING LIST -->

        <div id="bookingList">

            <div class="loading">

                Loading bookings...

            </div>

        </div>



        <!-- CLEAR -->

        <div class="clear-section">

            <button
                id="clearAllBtn"
                class="clear-btn"
            >

                🗑️ Delete All Bookings

            </button>

        </div>


    </section>


</main>



<script>

"use strict";


/* =====================================================
   API BASE URL

   Works with:
   Computer:
   http://localhost:5000

   Phone:
   http://192.168.1.103:5000
===================================================== */

const API_BASE =
    window.location.protocol === "file:"
        ? "http://192.168.1.103:5000"
        : `${window.location.protocol}//${window.location.hostname}:5000`;


/* =====================================================
   LOGIN CHECK
===================================================== */

if (
    sessionStorage.getItem(
        "adminLoggedIn"
    ) !== "true"
) {

    window.location.replace(
        "admin-login.html"
    );

}


/* =====================================================
   VARIABLES
===================================================== */

let bookings = [];



/* =====================================================
   LOAD BOOKINGS
===================================================== */

async function loadBookings() {

    const bookingList =
        document.getElementById(
            "bookingList"
        );


    bookingList.innerHTML = `

        <div class="loading">

            Loading bookings...

        </div>

    `;


    try {


        /*
           Admin booking API
        */

        const response =
            await fetch(
                API_BASE +
                "/api/admin/bookings"
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.message ||
                "Unable to load bookings."

            );

        }


        bookings =
            Array.isArray(
                data.bookings
            )
                ? data.bookings
                : [];


        updateStatistics();


        displayBookings(
            bookings
        );


    } catch (error) {

        console.error(
            "Load bookings error:",
            error
        );


        bookingList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    ⚠️

                </div>

                <h3>
                    Unable to load bookings
                </h3>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}



/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics() {


    document.getElementById(
        "totalBookings"
    ).textContent =
        bookings.length;


    let revenue = 0;


    bookings.forEach(
        function(booking) {

            revenue +=
                Number(
                    booking.total || 0
                );

        }
    );


    document.getElementById(
        "totalRevenue"
    ).textContent =
        "₹" +
        revenue.toLocaleString(
            "en-IN"
        );


    document.getElementById(
        "vehicleBookings"
    ).textContent =
        bookings.filter(
            function(booking) {

                return booking.vehicle;

            }
        ).length;


    const destinations =
        new Set();


    bookings.forEach(
        function(booking) {

            if (
                booking.destination
            ) {

                destinations.add(
                    String(
                        booking.destination
                    ).trim().toLowerCase()
                );

            }

        }
    );


    document.getElementById(
        "destinationCount"
    ).textContent =
        destinations.size;

}



/* =====================================================
   DISPLAY BOOKINGS
===================================================== */

function displayBookings(
    list
) {

    const bookingList =
        document.getElementById(
            "bookingList"
        );


    if (
        !Array.isArray(list) ||
        list.length === 0
    ) {

        bookingList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    📭

                </div>

                <h3>
                    No bookings found
                </h3>

                <p>
                    There are no bookings available.
                </p>

            </div>

        `;

        return;

    }


    bookingList.innerHTML =
        list.map(
            function(booking) {

                return createBookingCard(
                    booking
                );

            }
        ).join("");

}



/* =====================================================
   BOOKING CARD
===================================================== */

function createBookingCard(
    booking
) {


    const bookingId =
        booking.booking_id ||
        booking.bookingId ||
        "KT-DEMO";


    const name =
        booking.name ||
        "Customer";


    const mobile =
        booking.mobile ||
        "-";


    const fromLocation =
        booking.from_location ||
        booking.fromLocation ||
        "-";


    const destination =
        booking.destination ||
        "-";


    const date =
        booking.travel_date ||
        booking.travelDate ||
        booking.date ||
        "-";


    const days =
        booking.days ||
        "-";


    const travelers =
        booking.travelers ||
        "-";


    const vehicle =
        booking.vehicle ||
        "-";


    const paymentMethod =
        booking.payment_method ||
        booking.paymentMethod ||
        "Pending";


    const status =
        booking.status ||
        "Pending";


    const total =
        Number(
            booking.total || 0
        );


    const statusClass =
        String(status)
            .toLowerCase()
            .includes("paid")
                ? "paid"
                : "pending";


    return `

        <div class="booking-card">

            <div class="booking-top">

                <div class="booking-id">

                    🎫
                    ${escapeHTML(
                        bookingId
                    )}

                </div>

                <div class="status ${statusClass}">

                    ${escapeHTML(
                        status
                    )}

                </div>

            </div>


            <div class="booking-details">


                <div class="detail">

                    👤
                    <strong>Name:</strong>
                    ${escapeHTML(
                        name
                    )}

                </div>


                <div class="detail">

                    📱
                    <strong>Mobile:</strong>
                    ${escapeHTML(
                        mobile
                    )}

                </div>


                <div class="detail">

                    📍
                    <strong>From:</strong>
                    ${escapeHTML(
                        fromLocation
                    )}

                </div>


                <div class="detail">

                    🏞️
                    <strong>Destination:</strong>
                    ${escapeHTML(
                        destination
                    )}

                </div>


                <div class="detail">

                    📅
                    <strong>Travel Date:</strong>
                    ${escapeHTML(
                        date
                    )}

                </div>


                <div class="detail">

                    🗓️
                    <strong>Days:</strong>
                    ${escapeHTML(
                        days
                    )}

                </div>


                <div class="detail">

                    👥
                    <strong>Travelers:</strong>
                    ${escapeHTML(
                        travelers
                    )}

                </div>


                <div class="detail">

                    🚌
                    <strong>Vehicle:</strong>
                    ${escapeHTML(
                        vehicle
                    )}

                </div>


                <div class="detail">

                    💳
                    <strong>Payment:</strong>
                    ${escapeHTML(
                        paymentMethod
                    )}

                </div>


            </div>


            <div class="booking-bottom">


                <div class="booking-total">

                    Total:
                    ₹${total.toLocaleString(
                        "en-IN"
                    )}

                </div>


                <button
                    class="delete-btn"
                    onclick="deleteBooking('${escapeAttribute(
                        bookingId
                    )}')"
                >

                    🗑️ Delete

                </button>


            </div>


        </div>

    `;

}



/* =====================================================
   SEARCH
===================================================== */

document.getElementById(
    "searchBooking"
).addEventListener(
    "input",
    function() {

        const search =
            this.value
                .trim()
                .toLowerCase();


        if (!search) {

            displayBookings(
                bookings
            );

            return;

        }


        const filtered =
            bookings.filter(
                function(booking) {


                    const values = [

                        booking.name,

                        booking.mobile,

                        booking.destination,

                        booking.booking_id,

                        booking.bookingId,

                        booking.from_location,

                        booking.vehicle,

                        booking.status

                    ];


                    return values.some(
                        function(value) {

                            return String(
                                value || ""
                            )
                            .toLowerCase()
                            .includes(
                                search
                            );

                        }
                    );

                }
            );


        displayBookings(
            filtered
        );

    }
);



/* =====================================================
   DELETE SINGLE BOOKING
===================================================== */

async function deleteBooking(
    bookingId
) {


    if (
        !confirm(
            "Are you sure you want to delete this booking?"
        )
    ) {

        return;

    }


    try {


        const response =
            await fetch(
                API_BASE +
                "/api/bookings/" +
                encodeURIComponent(
                    bookingId
                ),
                {

                    method: "DELETE"

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.message ||
                "Delete failed."

            );

        }


        showMessage(
            "Booking deleted successfully.",
            "success"
        );


        await loadBookings();


    } catch (error) {

        console.error(
            "Delete booking error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to delete booking.",
            "error"
        );

    }

}



/* =====================================================
   DELETE ALL
===================================================== */

document.getElementById(
    "clearAllBtn"
).addEventListener(
    "click",
    async function() {


        if (
            bookings.length === 0
        ) {

            showMessage(
                "There are no bookings to delete.",
                "error"
            );

            return;

        }


        if (
            !confirm(
                "Delete ALL bookings? This cannot be undone."
            )
        ) {

            return;

        }


        try {


            const response =
                await fetch(
                    API_BASE +
                    "/api/bookings",
                    {

                        method: "DELETE"

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Unable to delete bookings."

                );

            }


            showMessage(
                "All bookings deleted successfully.",
                "success"
            );


            await loadBookings();


        } catch (error) {

            console.error(
                "Clear bookings error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to delete all bookings.",
                "error"
            );

        }

    }
);



/* =====================================================
   REFRESH
===================================================== */

document.getElementById(
    "refreshBtn"
).addEventListener(
    "click",
    function() {

        loadBookings();

    }
);



/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
    "logoutBtn"
).addEventListener(
    "click",
    function() {


        if (
            !confirm(
                "Are you sure you want to logout?"
            )
        ) {

            return;

        }


        sessionStorage.removeItem(
            "adminLoggedIn"
        );


        sessionStorage.removeItem(
            "adminUser"
        );


        window.location.replace(
            "admin-login.html"
        );

    }
);



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "adminMessage"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    setTimeout(
        function() {

            message.style.display =
                "none";

        },
        3000
    );

}



/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}



/* =====================================================
   START
===================================================== */

loadBookings();

</script>


</body>

</html>
