<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Karnataka Travel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4faf6;

            color: #333;
        }


        /* ==============================
           HEADER
        ============================== */

        header {

            height: 60px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 8%;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .logo {

            font-size: 18px;

            font-weight: bold;

            color: #087f3d;
        }


        .logo span {

            color: #222;
        }


        nav {

            display: flex;

            gap: 18px;
        }


        nav a {

            text-decoration: none;

            color: #333;

            font-size: 13px;
        }


        nav a:hover {

            color: #087f3d;
        }


        /* ==============================
           PAGE
        ============================== */

        .page {

            min-height:
                calc(100vh - 60px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;
        }


        /* ==============================
           BOX
        ============================== */

        .forgot-box {

            width: 100%;

            max-width: 460px;

            background: white;

            padding: 32px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.12);
        }


        /* ==============================
           ICON
        ============================== */

        .icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #e8f5ed;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;
        }


        h1 {

            text-align: center;

            color: #087f3d;

            margin: 0 0 8px;

            font-size: 28px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* ==============================
           STEPS
        ============================== */

        .step {

            display: none;
        }


        .step.active {

            display: block;
        }


        /* ==============================
           FORM
        ============================== */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 14px;
        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #087f3d;

            box-shadow:
                0 0 0 2px
                rgba(8,127,61,0.08);
        }


        /* ==============================
           BUTTON
        ============================== */

        .btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #087f3d;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .btn:hover {

            background: #05652f;
        }


        .btn:disabled {

            background: #999;

            cursor: not-allowed;
        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;

            font-weight: bold;

            line-height: 1.4;
        }


        .message.error {

            display: block;

            background: #ffebee;

            color: #c62828;
        }


        .message.success {

            display: block;

            background: #e8f5e9;

            color: #087f3d;
        }


        .message.info {

            display: block;

            background: #e3f2fd;

            color: #1565c0;
        }


        /* ==============================
           BACK LINK
        ============================== */

        .back-login {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }


        .back-login a {

            color: #087f3d;

            text-decoration: none;

            font-weight: bold;
        }


        .back-login a:hover {

            text-decoration: underline;
        }


        /* ==============================
           OTP DEVELOPMENT BOX
        ============================== */

        .development-otp {

            display: none;

            margin-top: 15px;

            padding: 12px;

            background: #fff8e1;

            color: #795548;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }


        .development-otp strong {

            font-size: 20px;

            color: #c62828;

            letter-spacing: 3px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            header {

                padding: 0 15px;
            }


            nav {

                gap: 8px;
            }


            nav a {

                font-size: 10px;
            }


            .page {

                padding: 20px 12px;
            }


            .forgot-box {

                padding: 24px 20px;
            }


            h1 {

                font-size: 24px;
            }


            .icon {

                width: 60px;

                height: 60px;

                font-size: 29px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">

        🏛️ Karnataka
        <span>Travel</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<!-- =====================================================
     PAGE
===================================================== -->

<div class="page">


    <div class="forgot-box">


        <div class="icon">

            🔐

        </div>


        <h1>

            Forgot Password?

        </h1>


        <p class="subtitle">

            Enter your registered email or mobile number
            to reset your Karnataka Travel password.

        </p>



        <!-- =================================================
             STEP 1
        ================================================== -->

        <div
            id="step1"
            class="step active"
        >

            <form id="forgotForm">


                <div class="form-group">

                    <label for="email">

                        📧 Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter registered email"
                    >

                </div>


                <div style="
                    text-align:center;
                    margin:8px 0;
                    color:#777;
                    font-size:13px;
                ">

                    OR

                </div>


                <div class="form-group">

                    <label for="mobile">

                        📱 Mobile Number

                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10 digit mobile number"
                        maxlength="10"
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                    id="sendOtpBtn"
                >

                    Send OTP

                </button>


            </form>

        </div>



        <!-- =================================================
             STEP 2
        ================================================== -->

        <div
            id="step2"
            class="step"
        >

            <form id="verifyForm">


                <div class="form-group">

                    <label for="otp">

                        🔢 Enter OTP

                    </label>

                    <input
                        type="text"
                        id="otp"
                        placeholder="Enter 6 digit OTP"
                        maxlength="6"
                        inputmode="numeric"
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                    id="verifyOtpBtn"
                >

                    Verify OTP

                </button>


            </form>


            <div
                id="developmentOtp"
                class="development-otp"
            >

                Development OTP:

                <br>

                <strong id="otpValue">
                    ------
                </strong>

            </div>

        </div>



        <!-- =================================================
             STEP 3
        ================================================== -->

        <div
            id="step3"
            class="step"
        >

            <form id="resetForm">


                <div class="form-group">

                    <label for="newPassword">

                        🔒 New Password

                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">

                        🔒 Confirm Password

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn"
                    id="resetBtn"
                >

                    Reset Password

                </button>


            </form>

        </div>



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- =================================================
             BACK
        ================================================== -->

        <div class="back-login">

            <a href="login.html">

                ← Back to Login

            </a>

        </div>


    </div>

</div>



<script>

"use strict";


/* =====================================================
   API URL

   Works on:
   Computer
   Mobile
   Same Wi-Fi
===================================================== */

const API_BASE =
    window.location.protocol === "file:"
        ? "http://localhost:5000"
        : `${window.location.protocol}//${window.location.hostname}:5000`;



/* =====================================================
   VARIABLES
===================================================== */

let recoveryEmail = "";

let recoveryMobile = "";

let userId = null;

let verifiedOtp = "";



/* =====================================================
   ELEMENTS
===================================================== */

const forgotForm =
    document.getElementById("forgotForm");

const verifyForm =
    document.getElementById("verifyForm");

const resetForm =
    document.getElementById("resetForm");

const message =
    document.getElementById("message");

const sendOtpBtn =
    document.getElementById("sendOtpBtn");

const verifyOtpBtn =
    document.getElementById("verifyOtpBtn");

const resetBtn =
    document.getElementById("resetBtn");



/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}



function clearMessage() {

    message.textContent = "";

    message.className =
        "message";

    message.style.display =
        "none";

}



/* =====================================================
   STEP CHANGE
===================================================== */

function showStep(stepNumber) {

    document
        .getElementById("step1")
        .classList.remove("active");

    document
        .getElementById("step2")
        .classList.remove("active");

    document
        .getElementById("step3")
        .classList.remove("active");


    document
        .getElementById("step" + stepNumber)
        .classList.add("active");


    clearMessage();

}



/* =====================================================
   STEP 1
   SEND OTP
===================================================== */

forgotForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const mobile =
            document
                .getElementById("mobile")
                .value
                .replace(/\D/g, "");


        if (!email && !mobile) {

            showMessage(
                "Please enter email or mobile number.",
                "error"
            );

            return;

        }


        if (
            mobile &&
            mobile.length !== 10
        ) {

            showMessage(
                "Mobile number must contain 10 digits.",
                "error"
            );

            return;

        }


        recoveryEmail = email;

        recoveryMobile = mobile;


        sendOtpBtn.disabled = true;

        sendOtpBtn.textContent =
            "Sending OTP...";


        try {

            const body = {};


            if (email) {

                body.email = email;

            } else {

                body.mobile = mobile;

            }


            const response =
                await fetch(
                    API_BASE +
                    "/api/forgot-password",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(body)

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Unable to send OTP."

                );

            }


            userId =
                data.userId;


            showStep(2);


            showMessage(
                "OTP sent successfully. Enter the OTP to continue.",
                "success"
            );


            /* =========================================
               DEVELOPMENT OTP
               Your backend currently returns
               developmentOTP.
            ========================================= */

            if (
                data.developmentOTP
            ) {

                document.getElementById(
                    "otpValue"
                ).textContent =
                    data.developmentOTP;


                document.getElementById(
                    "developmentOtp"
                ).style.display =
                    "block";

            }


        } catch (error) {

            console.error(
                "Forgot password error:",
                error
            );


            showMessage(
                error.message ||
                "Cannot connect to server.",
                "error"
            );


            sendOtpBtn.disabled =
                false;

            sendOtpBtn.textContent =
                "Send OTP";

        }

    }
);



/* =====================================================
   STEP 2
   VERIFY OTP
===================================================== */

verifyForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const otp =
            document
                .getElementById("otp")
                .value
                .trim();


        if (
            !/^[0-9]{6}$/.test(otp)
        ) {

            showMessage(
                "Please enter a valid 6 digit OTP.",
                "error"
            );

            return;

        }


        verifyOtpBtn.disabled =
            true;

        verifyOtpBtn.textContent =
            "Verifying...";


        try {

            const body = {

                otp: otp

            };


            if (recoveryEmail) {

                body.email =
                    recoveryEmail;

            } else {

                body.mobile =
                    recoveryMobile;

            }


            const response =
                await fetch(
                    API_BASE +
                    "/api/verify-otp",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(body)

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Invalid OTP."

                );

            }


            userId =
                data.userId ||
                userId;


            verifiedOtp =
                otp;


            showStep(3);


            showMessage(
                "OTP verified. Enter your new password.",
                "success"
            );


        } catch (error) {

            console.error(
                "OTP verification error:",
                error
            );


            showMessage(
                error.message ||
                "OTP verification failed.",
                "error"
            );


            verifyOtpBtn.disabled =
                false;

            verifyOtpBtn.textContent =
                "Verify OTP";

        }

    }
);



/* =====================================================
   STEP 3
   RESET PASSWORD
===================================================== */

resetForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const newPassword =
            document
                .getElementById("newPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (
            newPassword.length < 6
        ) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        if (
            newPassword !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        if (!userId) {

            showMessage(
                "User information is missing. Please start again.",
                "error"
            );

            showStep(1);

            return;

        }


        resetBtn.disabled =
            true;

        resetBtn.textContent =
            "Resetting Password...";


        try {

            const response =
                await fetch(
                    API_BASE +
                    "/api/reset-password",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                userId:
                                    userId,

                                otp:
                                    verifiedOtp,

                                newPassword:
                                    newPassword

                            })

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Password reset failed."

                );

            }


            showMessage(
                "Password changed successfully. Redirecting to login...",
                "success"
            );


            resetForm.reset();


            setTimeout(
                function() {

                    window.location.replace(
                        "login.html"
                    );

                },
                1500
            );


        } catch (error) {

            console.error(
                "Reset password error:",
                error
            );


            showMessage(
                error.message ||
                "Password reset failed.",
                "error"
            );


            resetBtn.disabled =
                false;

            resetBtn.textContent =
                "Reset Password";

        }

    }
);



/* =====================================================
   MOBILE INPUT
===================================================== */

document
    .getElementById("mobile")
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 10);

        }
    );



/* =====================================================
   OTP INPUT
===================================================== */

document
    .getElementById("otp")
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

        }
    );

</script>


</body>

</html>
