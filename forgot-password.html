<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Karnataka Travel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4faf6;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 70px auto;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #087f3d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #087f3d;
        }

        button {
            width: 100%;
            margin-top: 20px;

            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #087f3d;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #05652f;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #087f3d;
            text-decoration: none;
        }

        .message {
            margin-top: 15px;
            padding: 10px;

            border-radius: 6px;

            text-align: center;
            font-size: 14px;

            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #087f3d;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .hidden {
            display: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>🔐 Forgot Password</h1>

        <p class="subtitle">
            Enter your registered email or mobile number
        </p>


        <!-- STEP 1 -->

        <div id="step1">

            <label>
                📧 Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <label>
                📱 Mobile Number
            </label>

            <input
                type="text"
                id="mobile"
                maxlength="10"
                placeholder="Enter mobile number"
            >


            <button
                onclick="sendOTP()"
            >
                Send OTP
            </button>

        </div>


        <!-- STEP 2 -->

        <div
            id="step2"
            class="hidden"
        >

            <label>
                🔢 Enter 6 Digit OTP
            </label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                placeholder="Enter OTP"
            >


            <button
                onclick="verifyOTP()"
            >
                Verify OTP
            </button>

        </div>


        <!-- STEP 3 -->

        <div
            id="step3"
            class="hidden"
        >

            <label>
                🔑 New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >


            <label>
                🔑 Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >


            <button
                onclick="resetPassword()"
            >
                Change Password
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="login.html"
            class="back"
        >
            ← Back to Login
        </a>

    </div>

</div>


<script>

let userId = null;
let verifiedOTP = null;


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


/* =====================================================
   SEND OTP
===================================================== */

async function sendOTP() {

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const mobile =
        document.getElementById(
            "mobile"
        ).value.trim();


    if (!email && !mobile) {

        showMessage(
            "Enter email or mobile number.",
            "error"
        );

        return;
    }


    if (
        mobile &&
        !/^[0-9]{10}$/.test(mobile)
    ) {

        showMessage(
            "Enter valid 10 digit mobile number.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/forgot-password",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email:
                            email || null,

                        mobile:
                            mobile || null

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Unable to send OTP.",
                "error"
            );

            return;
        }


        userId =
            data.userId;


        /*
           Development mode:
           OTP server response ನಲ್ಲಿ
           ಬರುತ್ತದೆ.
        */

        showMessage(
    "OTP sent successfully. Please enter the 6 digit OTP.",
    "success"
);


        document.getElementById(
            "step1"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "step2"
        ).classList.remove(
            "hidden"
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Server connection failed.",
            "error"
        );

    }

}


/* =====================================================
   VERIFY OTP
===================================================== */

async function verifyOTP() {

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const mobile =
        document.getElementById(
            "mobile"
        ).value.trim();

    const otp =
        document.getElementById(
            "otp"
        ).value.trim();


    if (!/^[0-9]{6}$/.test(otp)) {

        showMessage(
            "Enter valid 6 digit OTP.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/verify-otp",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email:
                            email || null,

                        mobile:
                            mobile || null,

                        otp

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Invalid OTP.",
                "error"
            );

            return;
        }


        userId =
            data.userId;

        verifiedOTP =
            otp;


        showMessage(
            "OTP verified successfully.",
            "success"
        );


        document.getElementById(
            "step2"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "step3"
        ).classList.remove(
            "hidden"
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Server connection failed.",
            "error"
        );

    }

}


/* =====================================================
   RESET PASSWORD
===================================================== */

async function resetPassword() {

    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;

    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    if (
        newPassword.length < 6
    ) {

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }


    if (
        newPassword !==
        confirmPassword
    ) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/reset-password",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        userId:

                            userId,

                        otp:

                            verifiedOTP,

                        newPassword:

                            newPassword

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Password reset failed.",
                "error"
            );

            return;
        }


        showMessage(
            "Password changed successfully. Redirecting to login...",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "login.html";

            },
            2000
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Server connection failed.",
            "error"
        );

    }

}

</script>

</body>

</html>
